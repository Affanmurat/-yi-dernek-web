<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İYİ DERNEK</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="site" title="İYİ Dernek arama ve dernek bilgileri"></iframe><script>
const apkButton='<a href="https://raw.githubusercontent.com/Affanmurat/-yi-dernek-web/main/base.apk" download="Iyi_Dernek.apk" aria-label="APK İndir" style="margin-left:auto;color:white;text-decoration:none;display:flex;flex-direction:column;align-items:center;min-width:70px;font-size:12px;font-weight:bold"><span style="font-size:27px">⬇</span><span>APK İndir</span></a>';
const old="let [ph,pb]=section('Telefon');if(r.phone){let num=String(r.phone).replace(/[^+\\d]/g,'');pb.append(link(r.phone,'tel:'+num,true));pb.append(el('p','muted','Numaraya dokunarak telefonun arama ekranını açabilirsiniz.'))}else pb.append(el('p','muted','Telefon bilgisi bulunmuyor.'));inside.append(ph);";
const replacement="let [ph,pb]=section('Telefon');if(r.phone){let nums=phoneNumbers(r.phone);if(nums.length){for(let i=0;i<nums.length;i++)pb.append(link((nums.length>1?'Telefon '+(i+1)+': ':'')+nums[i],'tel:'+nums[i],true));}else pb.append(el('p','muted','Telefon kaydı: '+r.phone+' (numara biçimi doğrulanamadı)'));pb.append(el('p','muted','Aramak istediğiniz numaraya dokunun.'))}else pb.append(el('p','muted','Telefon bilgisi bulunmuyor.'));inside.append(ph);";
const helper="function phoneNumbers(raw){const groups=String(raw||'').split(/[,;\\n\\r\\/]+|\\s+(?:ve|VE|&)\\s+/).filter(Boolean),out=[];for(const g of groups){const d=g.replace(/\\D/g,''),parts=[];if(/^(?:\\+90|0090)/.test(g.trim())&&d.length===12)parts.push('0'+d.slice(2));else if(d.length===10||d.length===11)parts.push(d);else if(d.length>=20&&d.length<=24){let s=d;while(s.length){const n=s[0]==='0'?11:10;if(s.length<n){parts.length=0;break;}parts.push(s.slice(0,n));s=s.slice(n)}}else{const m=g.match(/(?:\\+90|0090|0)?\\s*[235][0-9](?:[\\s().-]*[0-9]){8}/g);if(m)for(const v of m)parts.push(v.replace(/\\D/g,''))}for(let n of parts){if(n.startsWith('0090')&&n.length===14)n='0'+n.slice(4);else if(n.startsWith('90')&&n.length===12)n='0'+n.slice(2);else if(n.length===10)n='0'+n;if(/^0[235][0-9]{9}$/.test(n)&&!out.includes(n))out.push(n)}}return out;}\n";
fetch('Iyi_Dernek_Tek_Dosya_iPhone.html').then(r=>{if(!r.ok)throw Error('Veri yüklenemedi');return r.text()}).then(h=>{if(!h.includes(old))throw Error('Telefon bölümü bulunamadı');h=h.replace(old,replacement).replace('function makeCard(r){',helper+'function makeCard(r){');document.getElementById('site').srcdoc=h.replace('<h1>İYİ<br>DERNEK</h1>','<h1>İYİ<br>DERNEK<br><span style="display:block;font-size:16px;letter-spacing:.15em;margin-top:5px">İZMİR</span></h1>').replace('</header>',apkButton+'</header>')}).catch(e=>{document.body.textContent='Site yüklenemedi: '+e.message});
</script></body></html>
